<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GNSS Trajectory Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    padding: 10px 16px; background: #1f2a37; color: #fff;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .dropzone {
    border: 2px dashed #7a8699; border-radius: 6px; padding: 8px 14px;
    font-size: 13px; color: #d6dce5; cursor: pointer; transition: background 0.15s;
  }
  .dropzone.hover, .dropzone:hover { background: #33415a; }
  .dropzone input { display: none; }
  #stats { font-size: 12px; color: #b7c0cc; }
  main { flex: 1; position: relative; }
  #map { position: absolute; inset: 0; }
  #placeholder {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #667; font-size: 15px; text-align: center; padding: 20px; background: #f3f5f7;
  }
  .legend {
    background: white; padding: 8px 12px; border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4); font-size: 13px; line-height: 1.5;
  }
  .legend div.row { display: flex; align-items: center; margin: 2px 0; }
  .swatch { display: inline-block; width: 14px; height: 14px; margin-right: 6px; border-radius: 2px; flex-shrink: 0; }
  #clearBtn {
    background: transparent; color: #d6dce5; border: 1px solid #7a8699; border-radius: 4px;
    padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  #clearBtn:hover { background: #33415a; }
  a, a:visited { color: #9cd2ff; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>GNSS Trajectory Viewer</h1>
    <label id="fileDropzone" class="dropzone" for="fileInput">
      Drop .nmea files/folder here or click to choose
      <input id="fileInput" type="file" multiple accept=".nmea,.txt" />
    </label>
    <label id="folderDropzone" class="dropzone" style="border-style:solid;">
      Choose folder
      <input id="folderInput" type="file" webkitdirectory directory multiple style="display:none" />
    </label>
    <button id="clearBtn">Clear</button>
    <div id="stats"></div>
  </header>
  <main>
    <div id="map"></div>
    <div id="placeholder">
      Drop one or more <b>EXTRA_GNSS/*.nmea</b> log files (or the whole folder) above to plot the
      trajectory, colored by RTK fix quality.<br/>
      Everything runs locally in your browser &mdash; files are never uploaded anywhere.
    </div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const QUALITY_INFO = {
  "0": { label: "Invalid",   color: "#888888" },
  "1": { label: "GPS",       color: "#e6194b" },
  "2": { label: "DGPS",      color: "#f58231" },
  "3": { label: "PPS",       color: "#469990" },
  "4": { label: "RTK Fixed", color: "#3cb44b" },
  "5": { label: "RTK Float", color: "#4363d8" },
  "6": { label: "Estimated", color: "#911eb4" },
};
function qualityInfo(q) {
  return QUALITY_INFO[q] || { label: "Q" + q, color: "#000000" };
}

function nmeaCoordToDecimal(value, hemisphere) {
  if (!value) return null;
  const dot = value.indexOf(".");
  if (dot < 0) return null;
  const degLen = dot - 2;
  const deg = parseFloat(value.slice(0, degLen));
  const minutes = parseFloat(value.slice(degLen));
  let decimal = deg + minutes / 60.0;
  if (hemisphere === "S" || hemisphere === "W") decimal = -decimal;
  return decimal;
}

function parseGgaLine(nmea) {
  const fields = nmea.split(",");
  if (fields.length < 7) return null;
  if (fields[0] !== "$GNGGA" && fields[0] !== "$GPGGA") return null;
  const lat = nmeaCoordToDecimal(fields[2], fields[3]);
  const lon = nmeaCoordToDecimal(fields[4], fields[5]);
  if (lat === null || lon === null || isNaN(lat) || isNaN(lon)) return null;
  const quality = fields[6];
  return { lat, lon, quality };
}

function parseFileText(text) {
  const points = [];
  const lines = text.split(/\r?\n/);
  for (const rawLine of lines) {
    const line = rawLine.trim();
    if (!line) continue;
    const firstSpace = line.indexOf(" ");
    if (firstSpace < 0) continue;
    const rest = line.slice(firstSpace + 1);
    const secondSpace = rest.indexOf(" ");
    if (secondSpace < 0) continue;
    const tsStr = line.slice(0, firstSpace);
    const nmea = rest.slice(secondSpace + 1);
    const ts = Number(tsStr);
    if (!Number.isFinite(ts)) continue;
    const parsed = parseGgaLine(nmea);
    if (!parsed) continue;
    points.push({ ts, lat: parsed.lat, lon: parsed.lon, quality: parsed.quality });
  }
  return points;
}

function buildSegments(points) {
  const segments = [];
  let currentQ = null;
  let currentPts = [];
  for (const p of points) {
    if (p.quality !== currentQ) {
      if (currentPts.length) {
        currentPts.push([p.lat, p.lon]);
        segments.push({ quality: currentQ, points: currentPts });
      }
      currentQ = p.quality;
      currentPts = [[p.lat, p.lon]];
    } else {
      currentPts.push([p.lat, p.lon]);
    }
  }
  if (currentPts.length) segments.push({ quality: currentQ, points: currentPts });
  return segments;
}

function qualityDurations(points) {
  const durations = {};
  for (let i = 1; i < points.length; i++) {
    const prev = points[i - 1];
    const cur = points[i];
    const dt = (cur.ts - prev.ts) / 1e9;
    if (dt >= 0 && dt <= 30) {
      durations[prev.quality] = (durations[prev.quality] || 0) + dt;
    }
  }
  return durations;
}

const map = L.map("map");
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 22,
  attribution: "&copy; OpenStreetMap contributors",
}).addTo(map);

let currentLayers = [];
let legendControl = null;

function render(allPoints) {
  currentLayers.forEach((l) => map.removeLayer(l));
  currentLayers = [];
  if (legendControl) { map.removeControl(legendControl); legendControl = null; }

  document.getElementById("placeholder").style.display = allPoints.length ? "none" : "flex";
  if (!allPoints.length) {
    document.getElementById("stats").textContent = "";
    return;
  }

  allPoints.sort((a, b) => a.ts - b.ts);
  const segments = buildSegments(allPoints);
  const bounds = [];
  segments.forEach((seg) => {
    const info = qualityInfo(seg.quality);
    const line = L.polyline(seg.points, { color: info.color, weight: 4, opacity: 0.85 })
      .bindTooltip(info.label)
      .addTo(map);
    currentLayers.push(line);
    seg.points.forEach((pt) => bounds.push(pt));
  });
  map.fitBounds(bounds);

  const durations = qualityDurations(allPoints);
  const total = Object.values(durations).reduce((a, b) => a + b, 0) || 1;
  const sortedQ = Object.keys(durations).sort((a, b) => durations[b] - durations[a]);

  legendControl = L.control({ position: "bottomright" });
  legendControl.onAdd = function () {
    const div = L.DomUtil.create("div", "legend");
    let rows = "<b>Fix quality (time)</b><br>";
    sortedQ.forEach((q) => {
      const info = qualityInfo(q);
      const t = durations[q];
      rows += `<div class="row"><span class="swatch" style="background:${info.color}"></span>${info.label} &mdash; ${(t / 60).toFixed(1)} min (${(100 * t / total).toFixed(1)}%)</div>`;
    });
    div.innerHTML = rows;
    return div;
  };
  legendControl.addTo(map);

  const start = new Date(allPoints[0].ts / 1e6);
  const end = new Date(allPoints[allPoints.length - 1].ts / 1e6);
  const durMin = (allPoints[allPoints.length - 1].ts - allPoints[0].ts) / 1e9 / 60;
  document.getElementById("stats").textContent =
    `${allPoints.length} fixes | ${durMin.toFixed(1)} min | ${start.toISOString().slice(11, 19)}–${end.toISOString().slice(11, 19)} UTC`;
}

let allPoints = [];

async function handleFiles(fileList) {
  const files = Array.from(fileList).filter((f) => f.name.toLowerCase().endsWith(".nmea") || f.name.toLowerCase().endsWith(".txt"));
  for (const file of files) {
    const text = await file.text();
    const pts = parseFileText(text);
    allPoints = allPoints.concat(pts);
  }
  render(allPoints);
}

// Recursively collect files from DataTransferItemList (supports folder drag & drop)
function collectEntryFiles(entry) {
  return new Promise((resolve) => {
    if (entry.isFile) {
      entry.file((file) => resolve([file]), () => resolve([]));
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const all = [];
      const readBatch = () => {
        reader.readEntries(async (entries) => {
          if (!entries.length) {
            const nested = await Promise.all(all.map(collectEntryFiles));
            resolve(nested.flat());
            return;
          }
          all.push(...entries);
          readBatch();
        }, () => resolve([]));
      };
      readBatch();
    } else {
      resolve([]);
    }
  });
}

const primaryDropzone = document.getElementById("fileDropzone");
const folderDropzone = document.getElementById("folderDropzone");
const fileInput = document.getElementById("fileInput");
const folderInput = document.getElementById("folderInput");

fileInput.addEventListener("change", (e) => handleFiles(e.target.files));
folderInput.addEventListener("change", (e) => handleFiles(e.target.files));
folderDropzone.addEventListener("click", (e) => {
  e.preventDefault();
  folderInput.click();
});

["dragenter", "dragover"].forEach((evt) =>
  primaryDropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    primaryDropzone.classList.add("hover");
  })
);
["dragleave", "drop"].forEach((evt) =>
  primaryDropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    primaryDropzone.classList.remove("hover");
  })
);
primaryDropzone.addEventListener("drop", async (e) => {
  const items = e.dataTransfer.items;
  if (items && items.length && items[0].webkitGetAsEntry) {
    const entries = Array.from(items).map((it) => it.webkitGetAsEntry()).filter(Boolean);
    const nested = await Promise.all(entries.map(collectEntryFiles));
    handleFiles(nested.flat());
  } else {
    handleFiles(e.dataTransfer.files);
  }
});

document.getElementById("clearBtn").addEventListener("click", () => {
  allPoints = [];
  render(allPoints);
  fileInput.value = "";
  folderInput.value = "";
});

map.setView([51.9, 19.1], 6); // fallback view (Poland) until data is loaded
</script>
</body>
</html>
